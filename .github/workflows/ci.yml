name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: node --test tests/*.test.mjs
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: lumira_next
          POSTGRES_USER: lumira_next
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lumira_next" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      LUMIRA_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/lumira_next
      LUMIRA_TEST_DB_USER: lumira_next
      LUMIRA_TEST_DB_PASSWORD: ci-only
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # spotless ratchetFrom resolves a baseline commit
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - run: ./backend/mvnw -f backend/pom.xml -B spotless:check
      # Includes the integration tests that need PostgreSQL (enabled by LUMIRA_TEST_DB_URL)
      # and ArchitectureTest, which freezes the module dependency graph.
      - run: ./backend/mvnw -f backend/pom.xml -B verify
  images:
    # Proves both production images still build; the server build also runs the localization generator.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/server.Dockerfile -t lumira-server:ci .
      - run: docker build -f deploy/web.Dockerfile -t lumira-web:ci .
      - name: Scan images for HIGH/CRITICAL vulnerabilities with a published fix
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: lumira-server:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: lumira-web:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan lockfiles and pom for known vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
