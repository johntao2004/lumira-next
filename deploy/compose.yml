name: lumira-next
services:
  database:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: lumira_next
      POSTGRES_USER: lumira_bootstrap
      POSTGRES_PASSWORD: ${LUMIRA_DB_BOOTSTRAP_PASSWORD:?Set a separate database bootstrap password}
      LUMIRA_DB_PASSWORD: ${LUMIRA_DB_PASSWORD:?Set application database password}
      LUMIRA_DB_MIGRATION_PASSWORD: ${LUMIRA_DB_MIGRATION_PASSWORD:?Set a separate migration password}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database/10-application-role.sh:/docker-entrypoint-initdb.d/10-application-role.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U lumira_bootstrap -d lumira_next"]
      interval: 5s
      timeout: 3s
      retries: 20
  server:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    environment:
      LUMIRA_DB_URL: jdbc:postgresql://database:5432/lumira_next
      LUMIRA_DB_USER: lumira_next
      LUMIRA_DB_MIGRATION_USER: lumira_migrator
      LUMIRA_DB_MIGRATION_PASSWORD: ${LUMIRA_DB_MIGRATION_PASSWORD:?Set a separate migration password}
      LUMIRA_DB_REQUIRE_UNPRIVILEGED: "true"
      LUMIRA_SECRET_KEYS: ${LUMIRA_SECRET_KEYS:?Set a persistent encryption key ring}
      LUMIRA_SECRET_ACTIVE_KEY: ${LUMIRA_SECRET_ACTIVE_KEY:-primary}
      LUMIRA_DB_PASSWORD: ${LUMIRA_DB_PASSWORD:?Set database password}
      LUMIRA_BOOTSTRAP_PASSWORD: ${LUMIRA_BOOTSTRAP_PASSWORD:?Set initial administrator password}
      LUMIRA_OFFICE_WORKER_URL: http://office-worker:18091
      LUMIRA_OFFICE_WORKER_TOKEN: ${LUMIRA_OFFICE_WORKER_TOKEN:?Set a dedicated Office worker token}
      LUMIRA_PLUGINS_FIXED_GRAPH: "true"
      # Optional: bearer token (>=32 chars) that enables /actuator/prometheus for scrapers on the private network.
      LUMIRA_METRICS_TOKEN: ${LUMIRA_METRICS_TOKEN:-}
      LUMIRA_TRUSTED_PROXY_ADDRESSES: ${LUMIRA_EDGE_ADDRESS:-172.30.78.2}
      # Production must make the transport decision explicitly. Use false only for local HTTP.
      LUMIRA_COOKIE_SECURE: ${LUMIRA_COOKIE_SECURE:?Set LUMIRA_COOKIE_SECURE=true for HTTPS (false only for local HTTP)}
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/8090 && printf 'GET /actuator/health/readiness HTTP/1.0\r\n\r\n' >&3 && grep -q ' 200 ' <&3
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s
    depends_on:
      database:
        condition: service_healthy
      office-worker:
        condition: service_healthy
    volumes:
      - files_data:/data/files
    networks:
      - default
      - proxy
      - office-internal
  office-worker:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: deploy/office-worker.Dockerfile
    environment:
      LUMIRA_OFFICE_WORKER_TOKEN: ${LUMIRA_OFFICE_WORKER_TOKEN:?Set a dedicated Office worker token}
      LUMIRA_OFFICE_WORKER_TEST_MODE: "false"
    mem_limit: 1g
    memswap_limit: 1g
    cpus: "1.0"
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD, java, -XX:ActiveProcessorCount=1, -XX:+UseSerialGC, -XX:CICompilerCount=2, -Xss512k, -Xms8m, -Xmx32m, -XX:MaxMetaspaceSize=64m, -jar, /app/app.jar, --office-worker-healthcheck]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - office-internal
  web:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    networks:
      - proxy
    depends_on:
      - server
  edge:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      target: edge
    restart: unless-stopped
    ports:
      - 127.0.0.1:8010:8010
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      proxy:
        ipv4_address: ${LUMIRA_EDGE_ADDRESS:-172.30.78.2}
    depends_on:
      web:
        condition: service_started
      server:
        condition: service_healthy
networks:
  office-internal:
    internal: true
  proxy:
    ipam:
      config:
        - subnet: ${LUMIRA_PROXY_SUBNET:-172.30.78.0/24}
          # Dynamic allocation must never hand out the edge's fixed address (it starts last, so the
          # other services would otherwise take it first). If you change LUMIRA_PROXY_SUBNET, set
          # LUMIRA_PROXY_POOL to a range inside it that excludes LUMIRA_EDGE_ADDRESS.
          ip_range: ${LUMIRA_PROXY_POOL:-172.30.78.128/25}
volumes:
  postgres_data:
  files_data:
